name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  required:
    name: Required / Node 22 / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run required gates
        run: pnpm test:ci

      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: required-browser-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  full:
    name: Full / Chromium and WebKit
    if: github.event_name != 'pull_request'
    needs: required
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install supported browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run full browser suite
        run: pnpm test:visual

      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-browser-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
